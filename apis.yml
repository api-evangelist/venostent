name: Venostent
description: 'VenoStent is a clinical-stage medical device company based in Houston,
  Texas, developing SelfWrap, a bioabsorbable perivascular wrap designed to reduce
  arteriovenous (AV) access-site failures in chronic kidney disease patients requiring
  hemodialysis. The company combines biomedical engineering, materials science, and
  medical 3D printing to improve the maturation and durability of dialysis access,
  where an estimated 50-60% of access sites fail within the first year. SelfWrap holds
  FDA Breakthrough Device Designation (2022) and is being evaluated in a 200-subject
  US clinical trial. VenoStent is backed by Norwest Venture Partners, IAG Capital,
  and Y Combinator, with additional support from the NSF and NIH. This is a medical
  device / healthcare company with no public API or developer surface; profiled in
  the API Evangelist network for portfolio and market context.'
